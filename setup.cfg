[flake8]
# The codebase targets a 100-character line length rather than the strict
# PEP 8 default of 79. E203 conflicts with common slice formatting and is
# safe to ignore.
max-line-length = 100
extend-ignore = E203
exclude =
    .git,
    __pycache__,
    build,
    dist
per-file-ignores =
    # conftest sets the matplotlib backend before other imports run, so
    # module-level imports intentionally appear after that call.
    tests/conftest.py:E402
