name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: pip install -e ".[us,dev]"   # core + yfinance (tests) + pytest/flake8

    - name: Check Python syntax
      run: |
        python -m py_compile portfolio_management/*.py portfolio_management/*/*.py
        python -m py_compile examples/*.py

    - name: Lint with flake8 (optional warnings)
      run: flake8 portfolio_management/ tests/ examples/ --count --statistics --show-source || true

    - name: Run unit tests
      run: pytest --maxfail=1 -q
